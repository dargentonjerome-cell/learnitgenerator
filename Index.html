<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Technicien Help Desk</title>
<style>
  :root{
    --ink:#1B2430;
    --paper:#F5F3EE;
    --amber:#E8A33D;
    --teal:#3E7C7A;
    --red:#C1554D;
    --line:#CFC9BB;
  }

  *{box-sizing:border-box;}

  .hd-quiz-root{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--ink);
    color:var(--paper);
    padding:40px 16px;
    display:flex;
    justify-content:center;
  }

  .hd-ticket{
    width:100%;
    max-width:560px;
    background:var(--paper);
    color:var(--ink);
    border:2px solid var(--ink);
  }

  .hd-ticket-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:18px 22px;
    border-bottom:2px dashed var(--ink);
  }

  .hd-ticket-id{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--teal);
  }

  .hd-ticket-title{
    font-size:20px;
    font-weight:700;
    margin:0;
  }

  .hd-queue{
    display:flex;
    gap:4px;
    padding:14px 22px 0 22px;
  }

  .hd-queue-item{
    flex:1;
    height:6px;
    background:var(--line);
  }

  .hd-queue-item.done{ background:var(--teal); }
  .hd-queue-item.current{ background:var(--amber); }

  .hd-body{
    padding:22px;
  }

  .hd-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:#6B6357;
    margin-bottom:10px;
  }

  .hd-question{
    font-size:18px;
    font-weight:600;
    line-height:1.4;
    margin:0 0 20px 0;
  }

  .hd-options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .hd-option{
    text-align:left;
    background:transparent;
    border:1.5px solid var(--ink);
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:flex-start;
  }

  .hd-option:hover:not(:disabled){
    background:rgba(27,36,48,0.06);
  }

  .hd-option:disabled{
    cursor:default;
  }

  .hd-option .hd-letter{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    color:var(--teal);
    flex-shrink:0;
  }

  .hd-option.correct{
    border-color:var(--teal);
    background:rgba(62,124,122,0.12);
  }

  .hd-option.correct .hd-letter{ color:var(--teal); }

  .hd-option.wrong{
    border-color:var(--red);
    background:rgba(193,85,77,0.10);
  }

  .hd-option.wrong .hd-letter{ color:var(--red); }

  .hd-feedback{
    margin-top:16px;
    padding:12px 14px;
    border-left:3px solid var(--teal);
    background:rgba(62,124,122,0.08);
    font-size:14px;
    line-height:1.5;
    display:none;
  }

  .hd-feedback.show{ display:block; }
  .hd-feedback.wrong{ border-left-color:var(--red); background:rgba(193,85,77,0.08); }

  .hd-nextrow{
    display:flex;
    justify-content:flex-end;
    margin-top:18px;
  }

  .hd-next{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:10px 18px;
    cursor:pointer;
    display:none;
  }

  .hd-next.show{ display:inline-block; }
  .hd-next:hover{ background:#31404F; }

  .hd-result{
    text-align:center;
    padding:10px 0 4px 0;
  }

  .hd-result-score{
    font-family:'IBM Plex Mono', monospace;
    font-size:46px;
    font-weight:600;
    color:var(--amber);
    margin:6px 0;
  }

  .hd-result-label{
    font-size:16px;
    font-weight:600;
    margin-bottom:6px;
  }

  .hd-result-text{
    font-size:14px;
    color:#4A4438;
    line-height:1.5;
    max-width:420px;
    margin:0 auto 22px auto;
  }

  .hd-restart{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:600;
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
    padding:10px 20px;
    cursor:pointer;
  }

  .hd-restart:hover{ background:rgba(27,36,48,0.06); }
</style>
</head>
<body>

<div class="hd-quiz-root">
  <div class="hd-ticket" id="hdTicket">
    <div class="hd-ticket-header">
      <p class="hd-ticket-title">Support Desk — Quiz</p>
      <span class="hd-ticket-id" id="hdTicketId">TICKET #001</span>
    </div>
    <div class="hd-queue" id="hdQueue"></div>
    <div class="hd-body" id="hdBody"></div>
  </div>
</div>

<script>
(function(){

  var QUESTIONS = [
    {
      q: "Un utilisateur ne peut plus se connecter à Windows après plusieurs tentatives échouées. Quelle est la première action à effectuer ?",
      options: [
        "Réinstaller le système d'exploitation",
        "Vérifier si le compte est verrouillé dans Active Directory et le déverrouiller",
        "Remplacer le disque dur",
        "Demander à l'utilisateur de changer d'ordinateur"
      ],
      correct: 1,
      feedback: "Un blocage après plusieurs échecs est presque toujours un verrouillage de compte lié à la politique de sécurité. On vérifie et déverrouille dans l'AD avant d'envisager autre chose."
    },
    {
      q: "Que signifie le sigle SLA dans le contexte d'un service support ?",
      options: [
        "Service Level Agreement (accord de niveau de service)",
        "System Log Analysis",
        "Software License Access",
        "Secure Login Authentication"
      ],
      correct: 0,
      feedback: "Le SLA définit les engagements de délai et de qualité de traitement des tickets, souvent liés à leur priorité."
    },
    {
      q: "Un utilisateur ne peut pas accéder à internet mais accède aux ressources du réseau local. Quelle commande utiliser en premier pour diagnostiquer ?",
      options: [
        "ping vers une adresse IP externe (ex: 8.8.8.8)",
        "shutdown /r",
        "chkdsk /f",
        "netstat -a"
      ],
      correct: 0,
      feedback: "Un ping vers une IP publique permet de savoir si la connectivité externe existe, avant de creuser côté DNS ou passerelle."
    },
    {
      q: "Le ping vers 8.8.8.8 fonctionne, mais l'utilisateur ne peut ouvrir aucun site par son nom (ex: google.com). Quelle est la cause la plus probable ?",
      options: [
        "Le câble réseau est débranché",
        "Un problème de résolution DNS",
        "Le disque dur est plein",
        "La carte graphique est défectueuse"
      ],
      correct: 1,
      feedback: "Ping fonctionne par IP mais pas par nom de domaine : c'est le signe classique d'un problème DNS."
    },
    {
      q: "Un email demande de manière urgente de cliquer sur un lien pour 'confirmer son mot de passe'. Comment qualifier cet email ?",
      options: [
        "Une mise à jour légitime de sécurité",
        "Une tentative de phishing probable",
        "Un message publicitaire",
        "Une erreur du serveur de messagerie"
      ],
      correct: 1,
      feedback: "Urgence, lien suspect et demande d'identifiants sont les signaux classiques d'une tentative de phishing. Le ticket doit être escaladé à la sécurité, sans cliquer sur le lien."
    },
    {
      q: "Dans un système de ticketing, à quoi sert le champ 'priorité' ?",
      options: [
        "À indiquer qui a créé le ticket",
        "À déterminer l'ordre esthétique d'affichage",
        "À définir l'urgence de traitement selon l'impact et l'urgence métier",
        "À choisir la couleur du ticket"
      ],
      correct: 2,
      feedback: "La priorité combine impact (combien de personnes/systèmes touchés) et urgence, pour respecter les délais du SLA."
    },
    {
      q: "Un utilisateur ne peut pas imprimer alors que l'imprimante fonctionne pour ses collègues. Quelle vérification est la plus pertinente en premier ?",
      options: [
        "Vérifier que la bonne imprimante est sélectionnée par défaut sur son poste",
        "Changer l'imprimante de bureau",
        "Réinitialiser le routeur",
        "Réinstaller Windows"
      ],
      correct: 0,
      feedback: "Si les collègues impriment normalement, le problème est probablement local au poste : pilote, file d'attente ou imprimante par défaut mal configurée."
    },
    {
      q: "Que signifie 'escalader un ticket' ?",
      options: [
        "Le supprimer du système",
        "Le transférer à un niveau de support plus expérimenté ou une autre équipe",
        "Augmenter son prix",
        "Le fermer automatiquement"
      ],
      correct: 1,
      feedback: "Escalader signifie transmettre le ticket à un support de niveau 2/3 ou à un spécialiste quand le niveau 1 ne peut pas résoudre le problème."
    },
    {
      q: "Un utilisateur distant a besoin d'aide et vous devez voir son écran pour diagnostiquer un problème. Quel type d'outil utiliser ?",
      options: [
        "Un tableur",
        "Un logiciel de prise en main à distance (ex: TeamViewer, AnyDesk, Assistance rapide Windows)",
        "Un antivirus",
        "Un gestionnaire de mots de passe"
      ],
      correct: 1,
      feedback: "Les outils de bureau à distance permettent de visualiser et parfois contrôler le poste de l'utilisateur pour diagnostiquer efficacement."
    },
    {
      q: "Quelle attitude est recommandée face à un utilisateur frustré au téléphone ?",
      options: [
        "Lui couper la parole pour aller plus vite",
        "Rester calme, reformuler son problème et le rassurer sur la prise en charge",
        "Raccrocher si le ton monte",
        "Lui dire que ce n'est pas de son ressort"
      ],
      correct: 1,
      feedback: "L'écoute active et la reformulation désamorcent la tension et permettent de bien cerner le problème avant d'agir."
    },
    {
      q: "Un logiciel refuse de s'installer avec le message 'droits administrateur requis'. Que faire ?",
      options: [
        "Ignorer le message et réessayer plusieurs fois",
        "Lancer l'installation avec des droits administrateur (ou faire la demande via la procédure d'élévation de droits)",
        "Désinstaller Windows",
        "Changer la langue du système"
      ],
      correct: 1,
      feedback: "Ce message indique simplement un manque de privilèges ; il faut exécuter l'installation en tant qu'administrateur selon la politique de l'entreprise."
    },
    {
      q: "Qu'est-ce qu'une base de connaissances (knowledge base) pour un help desk ?",
      options: [
        "Le disque dur du serveur principal",
        "Un répertoire de solutions et procédures documentées pour résoudre les problèmes courants",
        "La liste des mots de passe des utilisateurs",
        "Un logiciel de comptabilité"
      ],
      correct: 1,
      feedback: "La base de connaissances centralise les procédures et solutions déjà rencontrées, pour accélérer la résolution et harmoniser les réponses."
    }
  ];

  var current = 0;
  var score = 0;
  var answered = false;

  var body = document.getElementById('hdBody');
  var queue = document.getElementById('hdQueue');
  var ticketId = document.getElementById('hdTicketId');

  function renderQueue(){
    queue.innerHTML = '';
    for(var i=0;i<QUESTIONS.length;i++){
      var seg = document.createElement('div');
      seg.className = 'hd-queue-item';
      if(i < current) seg.className += ' done';
      else if(i === current) seg.className += ' current';
      queue.appendChild(seg);
    }
  }

  function pad(n){ return n < 10 ? '00'+n : (n<100?'0'+n:n); }

  function renderQuestion(){
    answered = false;
    var item = QUESTIONS[current];
    ticketId.textContent = 'TICKET #' + pad(current+1);
    renderQueue();

    var html = '';
    html += '<div class="hd-count">Ticket ' + (current+1) + ' / ' + QUESTIONS.length + '</div>';
    html += '<p class="hd-question">' + item.q + '</p>';
    html += '<div class="hd-options" id="hdOptions">';
    var letters = ['A','B','C','D'];
    for(var i=0;i<item.options.length;i++){
      html += '<button class="hd-option" data-idx="'+i+'"><span class="hd-letter">'+letters[i]+'</span><span>'+item.options[i]+'</span></button>';
    }
    html += '</div>';
    html += '<div class="hd-feedback" id="hdFeedback"></div>';
    html += '<div class="hd-nextrow"><button class="hd-next" id="hdNext">'+(current === QUESTIONS.length-1 ? 'Voir le résultat →' : 'Ticket suivant →')+'</button></div>';

    body.innerHTML = html;

    var buttons = body.querySelectorAll('.hd-option');
    buttons.forEach(function(btn){
      btn.addEventListener('click', function(){
        if(answered) return;
        answered = true;
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        var correctIdx = item.correct;
        buttons.forEach(function(b){ b.disabled = true; });
        if(idx === correctIdx){
          score++;
          this.classList.add('correct');
        } else {
          this.classList.add('wrong');
          buttons[correctIdx].classList.add('correct');
        }
        var fb = document.getElementById('hdFeedback');
        fb.textContent = item.feedback;
        fb.className = 'hd-feedback show' + (idx === correctIdx ? '' : ' wrong');
        document.getElementById('hdNext').className = 'hd-next show';
      });
    });

    document.getElementById('hdNext').addEventListener('click', function(){
      current++;
      if(current < QUESTIONS.length){
        renderQuestion();
      } else {
        renderResult();
      }
    });
  }

  function renderResult(){
    ticketId.textContent = 'CLÔTURÉ';
    current = QUESTIONS.length;
    renderQueue();

    var pct = Math.round((score / QUESTIONS.length) * 100);
    var label, text;
    if(pct >= 85){
      label = 'Niveau confirmé';
      text = "Solide maîtrise des réflexes de base d'un technicien help desk : diagnostic, priorisation et communication sont bien acquis.";
    } else if(pct >= 60){
      label = 'Bonnes bases';
      text = "Les fondamentaux sont là. Quelques notions à revoir, notamment sur le diagnostic réseau ou la gestion des tickets.";
    } else {
      label = 'À approfondir';
      text = "C'est un bon point de départ. Revois les bases du diagnostic (réseau, comptes, impressions) et les notions ITIL de base (SLA, priorité, escalade).";
    }

    body.innerHTML =
      '<div class="hd-result">' +
        '<div class="hd-result-label">' + label + '</div>' +
        '<div class="hd-result-score">' + score + ' / ' + QUESTIONS.length + '</div>' +
        '<p class="hd-result-text">' + text + '</p>' +
        '<button class="hd-restart" id="hdRestart">Recommencer le quiz</button>' +
      '</div>';

    document.getElementById('hdRestart').addEventListener('click', function(){
      current = 0;
      score = 0;
      renderQuestion();
    });
  }

  renderQuestion();
})();
</script>

</body>
</html>
